; TermoStats — firmware da Aula 10 (WiFi, HTTP/REST e JSON)
;
;   pio run -e esp32dev -t upload       grava na placa
;   pio device monitor                  monitor serial (115200)
;   pio test -e native                  testes da lógica pura, no PC
;
; A plataforma espressif32 8.0.0 traz o core Arduino-ESP32 3.3.x, que é o
; "core ESP32 3.x" pedido no roteiro da prática.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev            ; serve para a WeMos D1 R32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = huge_app.csv   ; 3 MB de app: TLS + JSON já ocupam 1,2 MB
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.15

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>     ; src/ depende do Arduino; aqui só entra lib/calculo
