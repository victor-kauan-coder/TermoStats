; Gateway BLE: conecta ao sensor, confirma cada pacote e repassa pela serial.
;   pio run -t upload        grava na placa do gateway
;   o gravador (pasta gravador/) lê esta serial; feche o pio monitor antes

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv   ; a pilha Bluedroid não cabe na partição padrão
build_flags = -I../comum
