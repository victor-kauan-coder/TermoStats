; Nó sensor BLE: lê o DHT22 e notifica o gateway.
;   pio run -t upload        grava na placa do sensor
;   pio device monitor       115200

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv   ; a pilha Bluedroid não cabe na partição padrão
build_flags = -I../comum
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.15
