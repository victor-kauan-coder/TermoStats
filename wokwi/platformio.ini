; Lab 03 - no MQTT (DHT22 -> broker) na placa, com o MESMO sketch do Wokwi.
;   pio run -t upload        grava na placa
;   pio device monitor       115200

[platformio]
src_dir = sketch              ; sketch.ino + secrets.h, os mesmos arquivos do Wokwi

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    256dpi/MQTT@^2.5.2
    bblanchon/ArduinoJson@^7.2.1
    beegee-tokyo/DHT sensor library for ESPx@^1.19
